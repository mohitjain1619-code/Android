// Load local.properties safely to read production configuration variables
Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

def fallbackBaseUrl = '"https://android-9t8m.onrender.com"'
def prodBaseUrl = properties.getProperty("production.base.url") ? '"' + properties.getProperty("production.base.url") + '"' : fallbackBaseUrl
def admobAppId = properties.getProperty("admob.app.id", "ca-app-pub-3940256099942544~3347511713")
def applovinSdkKey = properties.getProperty("applovin.sdk.key", "YOUR_APPLOVIN_SDK_KEY_HERE")

android {
    namespace 'com.mohitt.camverz'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.mohitt.camverz"
        minSdk = 24
        targetSdk = 36
        versionCode = 20
        versionName = "1.1.2"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        // Define BASE_URL for all API calls
        buildConfigField "String", "BASE_URL", prodBaseUrl

        // Inject variables into AndroidManifest.xml dynamically
        manifestPlaceholders = [
            admobAppId: admobAppId,
            applovinSdkKey: applovinSdkKey
        ]
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile file("camverz-release.jks")
            storePassword "camverz_pass_2026"
            keyAlias "camverz-alias"
            keyPassword "camverz_pass_2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packaging {
        resources {
            excludes += 'META-INF/native-image/org.bytedeco.javacpp/jni-config.json'
        }
        jniLibs {
            useLegacyPackaging = false
        }
