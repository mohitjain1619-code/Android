# Coturn TURN/STUN Server Configuration
# Same config works local and VPS

# Listener
listening-port=3478
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=49200

# Authentication
lt-cred-mech
user=camverz:camverz_turn_2024
realm=camverz.com

# Logging
log-file=stdout
verbose

# Performance
total-quota=100
stale-nonce=600

# Security
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Fingerprint for better NAT traversal
fingerprint
